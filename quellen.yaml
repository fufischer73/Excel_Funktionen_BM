- id: q-ms-autosumme
  titel: AutoSumme verwenden, um Zahlen in Excel zu addieren (Microsoft Support)
  url: https://support.microsoft.com/de-de/excel/use-autosum-to-sum-numbers-in-excel
  art: hersteller
  status: verifiziert
  geprueft_am: 2026-10-25
  belegt: Schaltfläche AutoSumme auf Start und unter Formeln; Zelle unter bzw. neben den Zahlen markieren, AutoSumme klicken, mit Eingabetaste bestätigen. Die Seite nennt weder Tastenkürzel noch Dropdown.

- id: q-ms-und
  titel: UND-Funktion (Microsoft Support)
  url: https://support.microsoft.com/de-de/office/und-funktion-5f19b2e8-e1df-4408-897a-ce285a19e9d9
  art: hersteller
  status: verifiziert
  geprueft_am: 2026-10-25
  belegt: Syntax UND(Wahrheitswert1; [Wahrheitswert2]; …); WAHR nur, wenn alle Bedingungen WAHR sind; typische Verwendung als Prüfung in WENN.

- id: q-ms-wenn
  titel: IF/WENN-Funktion (Microsoft Support, Excel; abgerufen in der Sprachversion ko-kr, dieselbe Seite wie de-de)
  url: https://support.microsoft.com/ko-kr/office/if-%ED%95%A8%EC%88%98-69aed7c9-4e8a-4755-a9bc-aa8bbff73be2
  art: hersteller
  status: verifiziert
  geprueft_am: 2026-10-25
  belegt: Syntax mit Prüfung, Wert bei WAHR und optionalem Wert bei FALSCH; mehrere WENN-Funktionen lassen sich verschachteln. Die Seite nennt keine Höchstzahl der Verschachtelungen. Die deutsche Seite wurde nicht abgerufen.

- id: q-oo-funktion
  titel: Inserting functions (ONLYOFFICE Help Center, englisch)
  url: https://helpcenter.onlyoffice.com/docs/userguides/spreadsheet_editor/InsertFunction.aspx
  art: hersteller
  status: verifiziert
  geprueft_am: 2026-10-25
  belegt: Funktion einfügen über Start (Schaltfläche mit häufigen Funktionen SUM, AVERAGE, MIN, MAX, COUNT), über Formel (Kategorien, Funktion-Dialog, Autosumme), Rechtsklick auf die Zelle, Symbol vor der Bearbeitungsleiste, Tippen mit = und Autovervollständigung, Umschalt+F3. Dialog heißt Insert Function.

- id: q-oo-formeltab
  titel: Formula tab (ONLYOFFICE Help Center, englisch)
  url: https://helpcenter.onlyoffice.com/docs/userguides/spreadsheet_editor/FormulaTab.aspx
  art: hersteller
  status: verifiziert
  geprueft_am: 2026-10-25
  belegt: Registerkarte Formel mit Insert-Function-Dialog, Autosumme, zuletzt verwendeten Funktionen und Kategorien. Deutsche Schaltflächennamen nennt die Seite nicht.

- id: q-autosumme-pfeil
  titel: Dropdown neben AutoSumme (Excel)
  art: eigene
  status: zu_pruefen
  belegt: Aussage im Modul R1, dass der Pfeil neben AutoSumme weitere Funktionen wie Mittelwert, Min und Max anbietet. Aus Allgemeinwissen, nicht aus einer abgerufenen Herstellerseite. Bitte in Excel prüfen.

- id: q-mittelwert-null
  titel: Verhalten von MITTELWERT bei 0, leeren Zellen und Text
  art: eigene
  status: zu_pruefen
  belegt: Aussage im Modul R1, dass MITTELWERT eine 0 mitzählt, leere Zellen und Text aber ignoriert. Aus Allgemeinwissen. Bitte in Excel und OnlyOffice mit einer Testtabelle prüfen.

- id: q-oder
  titel: ODER-Funktion (Excel)
  art: eigene
  status: zu_pruefen
  belegt: Aussage in Modul R5, dass ODER WAHR liefert, wenn mindestens eine Bedingung WAHR ist, analog zu UND. Die Herstellerseite zu ODER wurde nicht abgerufen.

- id: q-oo-deutsch
  titel: Deutsche Oberfläche und Argumenttrenner in OnlyOffice
  art: eigene
  status: zu_pruefen
  belegt: Menübezeichnungen in der deutschen OnlyOffice-Oberfläche (Start › Funktion einfügen, Formel › Autosumme) und Semikolon als Argumenttrenner in der deutschen Oberfläche. Die abgerufenen Hilfeseiten sind englisch. Bitte in der Schul-Installation prüfen.

- id: q-ms-anzahl
  titel: ANZAHL-Funktion (Microsoft Support)
  url: https://support.microsoft.com/de-de/office/anzahl-funktion-a59cd7fc-b623-4d93-87a4-d23bf411294c
  art: hersteller
  status: verifiziert
  geprueft_am: 2026-10-25
  belegt: ANZAHL zählt Zahlen und Datumsangaben; Text, Fehlerwerte und leere Zellen in Bezügen werden nicht gezählt; ANZAHL2 für Text. Syntax ANZAHL(Wert1; [Wert2]; …).

- id: q-ms-anzahl2
  titel: ANZAHL2-Funktion (Microsoft Support)
  url: https://support.microsoft.com/de-de/office/anzahl2-funktion-7dc98875-d5c1-46f1-9a82-53f3219e2509
  art: hersteller
  status: verifiziert
  geprueft_am: 2026-10-25
  belegt: "ANZAHL2 zählt alle nicht leeren Zellen unabhängig vom Datentyp (Zahlen, Text, Wahrheitswerte, Fehler); leere Zellen werden nicht gezählt, leerer Text \"\" aus einer Formel schon."

- id: q-ms-zaehlenwenn
  titel: Verwenden der ZÄHLENWENN-Funktion (Microsoft Support)
  url: https://support.microsoft.com/de-de/excel/get-started/use-the-countif-function-in-microsoft-excel
  art: hersteller
  status: verifiziert
  geprueft_am: 2026-10-25
  belegt: "Syntax mit Bereich und Suchkriterium; ein Kriterium pro Aufruf (mehrere: ZÄHLENWENNS); Text und Operatoren in Anführungszeichen; Zellbezug mit & an Operator binden, z. B. \"<>\"&B4; Platzhalter * und ?; keine Unterscheidung von Groß-/Kleinschreibung."

- id: q-ms-summewenn
  titel: SUMMEWENN-Funktion (Microsoft Support)
  url: https://support.microsoft.com/de-de/office/summewenn-funktion-169b8c99-c05c-4483-a712-1697a653039b
  art: hersteller
  status: verifiziert
  geprueft_am: 2026-10-25
  belegt: "Syntax SUMMEWENN(Bereich; Suchkriterien; [Summe_Bereich]); Summe_Bereich sollte gleich groß wie Bereich sein; Text und Kriterien mit Vergleichszeichen in Anführungszeichen, z. B. \">5\"; Platzhalter ? und *."

- id: q-ms-sverweis
  titel: SVERWEIS-Funktion (Microsoft Support)
  url: https://support.microsoft.com/de-de/excel/functions/vlookup-function
  art: hersteller
  status: verifiziert
  geprueft_am: 2026-10-25
  belegt: "Syntax SVERWEIS(Suchkriterium; Matrix; Spaltenindex; [Bereich_Verweis]); Suchkriterium muss in der ersten Spalte der Matrix stehen; WAHR (Standard) = ungefähre Übereinstimmung, erste Spalte muss sortiert sein; FALSCH = genaue Übereinstimmung; #NV bei fehlendem Treffer; #BEZUG! bei zu großem Spaltenindex."

- id: q-ms-runden
  titel: RUNDEN-Funktion (Microsoft Support, abgerufen als Excel-Seite)
  url: https://support.microsoft.com/de-de/excel/functions/round-function
  art: hersteller
  status: verifiziert
  geprueft_am: 2026-10-25
  belegt: Syntax RUNDEN(Zahl; Anzahl_Stellen); Anzahl_Stellen größer 0 = Dezimalstellen, 0 = ganze Zahl, kleiner 0 = Stellen links vom Komma; AUFRUNDEN rundet immer von null weg auf, ABRUNDEN immer zu null hin ab.

- id: q-ms-rang
  titel: RANG-Funktion (Microsoft Support)
  url: https://support.microsoft.com/de-de/office/rang-funktion-6a2fc49d-1831-4a03-9d8c-c279cf99f723
  art: hersteller
  status: verifiziert
  geprueft_am: 2026-10-25
  belegt: Syntax RANG(Zahl; Bezug; [Reihenfolge]); Reihenfolge weggelassen oder 0 = absteigend (größter Wert Rang 1), sonst aufsteigend; gleiche Werte erhalten gleichen Rang, der nächste Rang wird übersprungen; RANG wird nur aus Kompatibilitätsgründen beibehalten, Nachfolger sind RANG.GLEICH und RANG.MITTELW.

- id: q-ms-tage360
  titel: TAGE360-Funktion (Microsoft Support)
  url: https://support.microsoft.com/de-de/office/tage360-funktion-b9a509fd-49ef-407e-94df-0cbda5718c2a
  art: hersteller
  status: verifiziert
  geprueft_am: 2026-10-25
  belegt: Syntax TAGE360(Ausgangsdatum; Enddatum; [Methode]); Jahr mit zwölf Monaten zu je 30 Tagen; Methode FALSCH/weggelassen = US-Methode, WAHR = europäische Methode; Startdatum nach Enddatum ergibt negative Zahl; Datumsangaben am besten mit DATUM erzeugen.

- id: q-ms-heute
  titel: HEUTE-Funktion (Microsoft Support)
  url: https://support.microsoft.com/de-de/office/heute-funktion-5eb3078d-a82c-4736-8930-2f51a028fdd9
  art: hersteller
  status: verifiziert
  geprueft_am: 2026-10-25
  belegt: HEUTE() ohne Argumente liefert das aktuelle Datum als fortlaufende Zahl und aktualisiert sich bei jeder Neuberechnung bzw. beim Öffnen der Datei; Datum werden intern als fortlaufende Zahlen gespeichert.

- id: q-ms-datumzeit
  titel: Datums- und Uhrzeitfunktionen, Referenz (Microsoft Support)
  url: https://support.microsoft.com/de-de/office/datums-und-uhrzeitfunktionen-referenz-fd1b5961-c1ae-4677-be58-074152f97b81
  art: hersteller
  status: verifiziert
  geprueft_am: 2026-10-25
  belegt: "Kurzbeschreibung: JAHR, MONAT, TAG, STUNDE und MINUTE ermitteln aus einer fortlaufenden Zahl das Jahr, den Monat, den Tag, die Stunde bzw. die Minute; DATUM und ZEIT erzeugen fortlaufende Zahlen."

- id: q-zeit-bruchteil
  titel: Uhrzeit als Bruchteil eines Tages (Excel)
  art: eigene
  status: zu_pruefen
  belegt: "Aussage in Modul N5, dass Excel eine Uhrzeit als Bruchteil eines Tages speichert und sich Uhrzeiten voneinander abziehen lassen. Die abgerufenen Microsoft-Seiten nennen nur, dass Datum und Uhrzeit fortlaufende Zahlen sind. Bitte in Excel prüfen, zum Beispiel mit =C4-B4 und dem Zellenformat Standard."

- id: q-zinsformel
  titel: Zinsformel Zinsen = Kapital × Zinssatz × Tage ÷ 360
  art: eigene
  status: zu_pruefen
  belegt: "Aussage in Modul N5, dass bei Verzugszinsen im Büro üblicherweise mit 360 Zinstagen gerechnet wird und dass die Zinsen sich aus Kapital × Zinssatz × Tage ÷ 360 ergeben. Fachwissen aus dem Rechnungswesen, nicht aus einer abgerufenen Quelle. Der Zinssatz in der Übungsdatei (5 %) ist ein angenommener Wert. Bitte mit dem Lehrplan oder dem Lehrbuch abgleichen."
