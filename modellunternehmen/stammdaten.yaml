# Geschäftsregeln, die in den Aufgaben vorkommen. Abweichende Regeln einzelner Aufgaben stehen in abweichungen.md.
regeln:
  umsatzsteuer: 0.19
  umsatzsteuer_ermaessigt: 0.07
  versand:
    frei_ab_bestellwert: 50.00      # R3: über 50 € versandkostenfrei
    pauschale: 4.95
  skonto:
    satz: 0.02
    frist_tage: 10
  mengenrabatt_einfach:            # höchstens zwei WENN (R4, RM)
    - {ab: 0, satz: 0.00}
    - {ab: 100, satz: 0.05}
    - {ab: 500, satz: 0.10}
  mengenrabatt_staffel:            # mehr Stufen: nur mit SVERWEIS (ab Stufe 3)
    - {ab: 0, satz: 0.00}
    - {ab: 100, satz: 0.05}
    - {ab: 500, satz: 0.10}
    - {ab: 1000, satz: 0.15}
  zinssatz_verzug: 0.05
  stichtag_beispiel: 2026-06-15

