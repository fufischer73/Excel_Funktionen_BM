<script id="app-logic">
/* ---------- Hilfsfunktionen ---------- */
const STATUS_SYMBOLS = {empty:'', red:'✗', yellow:'~', green:'✓'};
const STATUS_LABELS = {empty:'noch nicht eingeschätzt', red:'kann ich noch nicht sicher', yellow:'übe ich gerade', green:'kann ich sicher'};
function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str==null?'':str; return d.innerHTML; }
function progressKey(){ return 'kannliste_progress_' + LIST_ID; }
function journalKey(){ return 'kannliste_journal_' + LIST_ID; }
function loadProgress(){ try{ return JSON.parse(localStorage.getItem(progressKey())||'{}'); }catch(e){ return {}; } }
function saveProgressData(data){ localStorage.setItem(progressKey(), JSON.stringify(data)); markSaved(); }
function loadJournal(){ try{ return JSON.parse(localStorage.getItem(journalKey())||'[]'); }catch(e){ return []; } }
function saveJournalData(data){ localStorage.setItem(journalKey(), JSON.stringify(data)); markSaved(); }
function markSaved(){
  const el=document.getElementById('saveStatus');
  if(!el) return;
  const now=new Date();
  el.textContent='💾 Gespeichert um '+now.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  el.classList.add('saved');
}
function lastActivityTimestamp(){
  const progress=loadProgress();
  const journal=loadJournal();
  let latest=null;
  Object.values(progress).forEach(v=>{ if(v.updated){ const d=new Date(v.updated); if(!latest||d>latest) latest=d; } });
  journal.forEach(e=>{ if(e.date){ const d=new Date(e.date); if(!latest||d>latest) latest=d; } });
  return latest;
}
function initSaveStatus(){
  const el=document.getElementById('saveStatus');
  if(!el) return;
  const latest=lastActivityTimestamp();
  if(latest){
    el.textContent='💾 Zuletzt gespeichert am '+latest.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})+' um '+latest.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
    el.classList.add('saved');
  } else {
    el.textContent='Noch nichts gespeichert';
    el.classList.remove('saved');
  }
}
function showNotification(message,type){
  type=type||'success';
  const el=document.getElementById('globalNotification');
  if(!el) return;
  el.textContent=message;
  el.className='notification show '+type;
  clearTimeout(window.__notifTimeout);
  window.__notifTimeout=setTimeout(()=>el.classList.remove('show'),4000);
}

/* ---------- Tabs ---------- */
function renderTabNav(){
  const nav=document.getElementById('tabNav');
  let html='<div class="nav-label" style="margin-top:0">Kompetenzbereiche</div>';
  COMPETENCES_DATA.areas.forEach((area,i)=>{
    html+=`<button class="tab-button${i===0?' active':''}" data-tab="area-${i}" onclick="switchTab('area-${i}')">${area.icon} ${area.name} (${area.competences.length})</button>`;
  });
  html+='<div class="nav-label">Meine Entwicklung</div>';
  html+=`<button class="tab-button" data-tab="lernplan" onclick="switchTab('lernplan')">🎯 Mein Lernplan</button>`;
  html+=`<button class="tab-button" data-tab="dashboard" onclick="switchTab('dashboard')">📈 Mein Fortschritt</button>`;
  html+=`<button class="tab-button" data-tab="journal" onclick="switchTab('journal')">📔 Lerntagebuch</button>`;
  nav.innerHTML=html;
}
function switchTab(tabId){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-button').forEach(b=>b.classList.remove('active'));
  const content=document.getElementById('tab-'+tabId);
  if(content) content.classList.add('active');
  const btn=document.querySelector(`.tab-button[data-tab="${tabId}"]`);
  if(btn) btn.classList.add('active');
  if(tabId==='lernplan') renderLernplan();
  if(tabId==='dashboard') renderDashboard();
  if(tabId==='journal') renderJournal();
}

/* ---------- Kompetenz-Tabellen (Schüleransicht) ---------- */
function renderAreaTabs(){
  const container=document.getElementById('tab-container');
  container.innerHTML='';
  const progress=loadProgress();
  COMPETENCES_DATA.areas.forEach((area,areaIndex)=>{
    const tabContent=document.createElement('div');
    tabContent.className='tab-content'+(areaIndex===0?' active':'');
    tabContent.id=`tab-area-${areaIndex}`;
    let html=`<h2 style="margin:20px 0">${area.icon} ${area.name}</h2><table><thead><tr><th style="width:18%">Thema</th><th style="width:34%">Ich kann...</th><th style="width:34%">Handlungssituation</th><th style="width:14%">Einschätzung</th></tr></thead><tbody>`;
    const groups={};
    area.competences.forEach((comp,i)=>{ if(!groups[comp.g]) groups[comp.g]=[]; groups[comp.g].push({comp,i}); });
    Object.keys(groups).forEach(groupName=>{
      const items=groups[groupName];
      html+=`<tr><td class="theme-cell" rowspan="${items.length}">${groupName}</td>`;
      items.forEach((item,idx)=>{
        if(idx>0) html+='<tr>';
        const key=areaIndex+'_'+item.i;
        const state=progress[key];
        const status=(state&&state.status)?state.status:'empty';
        const hasNote=!!(state&&state.note&&state.note.trim().length>0);
        html+=`<td>${item.comp.s}${modulLinks(item.comp)}</td><td>${item.comp.c}</td><td class="assess-cell">`+
          `<div class="traffic-light ${status}" data-key="${key}" tabindex="0" role="button" aria-label="Einschätzung: ${STATUS_LABELS[status]}. Aktivieren zum Ändern." title="Klicken oder Enter/Leertaste zum Einschätzen">${STATUS_SYMBOLS[status]}</div>`+
          `<button class="note-btn${hasNote?' has-note':''}" data-key="${key}" onclick="openNoteModal('${key}')" title="Reflexion / Notiz" aria-label="Notiz zu dieser Kompetenz${hasNote?' (vorhanden)':''}">📝</button>`+
          `<div class="note-print" data-key="${key}"></div>`+
          `</td></tr>`;
      });
    });
    html+='</tbody></table>';
    tabContent.innerHTML=html;
    container.appendChild(tabContent);
  });
}
function cycleStatus(key, el){
  const progress=loadProgress();
  const cur=(progress[key]&&progress[key].status)||'empty';
  const order=['empty','red','yellow','green'];
  const next=order[(order.indexOf(cur)+1)%order.length];
  if(!progress[key]) progress[key]={};
  progress[key].status=next;
  progress[key].updated=new Date().toISOString();
  saveProgressData(progress);
  el.className='traffic-light '+next;
  el.textContent=STATUS_SYMBOLS[next];
  el.setAttribute('aria-label','Einschätzung: '+STATUS_LABELS[next]+'. Aktivieren zum Ändern.');
}
document.addEventListener('click',function(e){
  if(e.target.classList && e.target.classList.contains('traffic-light')){
    cycleStatus(e.target.dataset.key, e.target);
  }
});
document.addEventListener('keydown',function(e){
  if(e.target.classList && e.target.classList.contains('traffic-light') && (e.key==='Enter'||e.key===' '||e.key==='Spacebar')){
    e.preventDefault();
    cycleStatus(e.target.dataset.key, e.target);
  }
});

/* ---------- Reflexions-Notizen ---------- */
let noteModalKey=null;
function questionForStatus(status){
  if(status==='red') return 'Was brauche ich noch, um diese Kompetenz zu lernen? Wer oder was kann mir dabei helfen?';
  if(status==='yellow') return 'Was fällt mir hier noch schwer? Woran möchte ich noch gezielt üben?';
  if(status==='green') return 'Woran erkennst du, dass du das sicher kannst? Wo hast du es zuletzt angewendet?';
  return 'Notiere hier, wo du aktuell stehst oder was dir dazu einfällt.';
}
function openNoteModal(key){
  noteModalKey=key;
  const progress=loadProgress();
  const state=progress[key]||{};
  const parts=key.split('_');
  const areaIdx=parseInt(parts[0],10), compIdx=parseInt(parts[1],10);
  const comp=COMPETENCES_DATA.areas[areaIdx].competences[compIdx];
  document.getElementById('noteCompetenceText').textContent=comp.s;
  document.getElementById('noteQuestion').textContent=questionForStatus(state.status||'empty');
  document.getElementById('noteTextarea').value=state.note||'';
  document.getElementById('noteModal').classList.add('active');
  document.body.style.overflow='hidden';
}
function closeNoteModal(){
  document.getElementById('noteModal').classList.remove('active');
  document.body.style.overflow='auto';
  noteModalKey=null;
}
function refreshPrintNotes(){
  const progress=loadProgress();
  document.querySelectorAll('.note-print').forEach(div=>{
    const key=div.dataset.key;
    const state=progress[key];
    if(state && state.note && state.note.trim()){
      div.textContent='📝 '+state.note.trim();
      div.classList.add('filled');
    } else {
      div.textContent='';
      div.classList.remove('filled');
    }
  });
  renderDashboard();
  renderJournal();
}
window.addEventListener('beforeprint', refreshPrintNotes);
function saveNote(){
  if(!noteModalKey) return;
  const progress=loadProgress();
  if(!progress[noteModalKey]) progress[noteModalKey]={status:'empty'};
  progress[noteModalKey].note=document.getElementById('noteTextarea').value;
  progress[noteModalKey].updated=new Date().toISOString();
  saveProgressData(progress);
  const btn=document.querySelector(`.note-btn[data-key="${noteModalKey}"]`);
  if(btn){
    if(progress[noteModalKey].note.trim()) btn.classList.add('has-note');
    else btn.classList.remove('has-note');
  }
  closeNoteModal();
  refreshPrintNotes();
  showNotification('Notiz gespeichert.','success');
}

/* ---------- Dashboard ---------- */
function computeStats(){
  const progress=loadProgress();
  const areaStats=[];
  const totalAll={red:0,yellow:0,green:0,empty:0,total:0};
  COMPETENCES_DATA.areas.forEach((area,areaIndex)=>{
    const stat={red:0,yellow:0,green:0,empty:0,total:area.competences.length};
    area.competences.forEach((c,i)=>{
      const key=areaIndex+'_'+i;
      const status=(progress[key]&&progress[key].status)||'empty';
      stat[status]++;
    });
    areaStats.push({name:area.name,icon:area.icon,red:stat.red,yellow:stat.yellow,green:stat.green,empty:stat.empty,total:stat.total});
    totalAll.red+=stat.red; totalAll.yellow+=stat.yellow; totalAll.green+=stat.green; totalAll.empty+=stat.empty; totalAll.total+=stat.total;
  });
  return {areaStats, totalAll};
}
function barHtml(label,s){
  const pct=n=> s.total? (n/s.total*100) : 0;
  let html='';
  if(label) html+=`<h3>${label}</h3>`;
  html+=`<div class="progress-bar">`+
    `<div class="seg green" style="width:${pct(s.green)}%">${s.green>0?s.green:''}</div>`+
    `<div class="seg yellow" style="width:${pct(s.yellow)}%">${s.yellow>0?s.yellow:''}</div>`+
    `<div class="seg red" style="width:${pct(s.red)}%">${s.red>0?s.red:''}</div>`+
    `<div class="seg empty" style="width:${pct(s.empty)}%">${s.empty>0?s.empty:''}</div>`+
    `</div>`+
    `<div class="progress-stats">`+
    `<span><span class="dot green"></span>${s.green} sicher</span>`+
    `<span><span class="dot yellow"></span>${s.yellow} in Arbeit</span>`+
    `<span><span class="dot red"></span>${s.red} noch offen</span>`+
    `<span><span class="dot empty"></span>${s.empty} nicht eingeschätzt</span>`+
    `</div>`;
  return html;
}
function mostRecentUpdate(){
  const progress=loadProgress();
  let latest=null;
  Object.values(progress).forEach(v=>{
    if(v.updated){ const d=new Date(v.updated); if(!latest||d>latest) latest=d; }
  });
  return latest ? (latest.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})+' um '+latest.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})) : null;
}
function collectNotes(){
  const progress=loadProgress();
  const notes=[];
  COMPETENCES_DATA.areas.forEach((area,areaIndex)=>{
    area.competences.forEach((comp,i)=>{
      const key=areaIndex+'_'+i;
      const state=progress[key];
      if(state && state.note && state.note.trim()){
        notes.push({areaName:area.name, areaIcon:area.icon, compText:comp.s, note:state.note.trim(), updated:state.updated, status:state.status||'empty'});
      }
    });
  });
  notes.sort((a,b)=> new Date(b.updated||0) - new Date(a.updated||0));
  return notes;
}
function renderDashboard(){
  const {areaStats,totalAll}=computeStats();
  const pctGreen=totalAll.total? Math.round(totalAll.green/totalAll.total*100) : 0;
  let html=`<div class="overall-box"><div>Gesamtfortschritt</div><div class="big-num">${pctGreen}%</div><div>sicher beherrscht (${totalAll.green} von ${totalAll.total} Kompetenzen)</div></div>`;
  html+=`<div class="dashboard-box">`+barHtml('Alle Bereiche zusammen',totalAll)+`</div>`;
  areaStats.forEach(s=>{ html+=`<div class="dashboard-box"><h3>${s.icon} ${s.name}</h3>`+barHtml(null,s)+`</div>`; });
  const last=mostRecentUpdate();
  html+=`<p style="text-align:center;color:#777;margin-top:10px;">${last?'Letzte Einschätzung: '+last:'Du hast noch keine Kompetenz eingeschätzt. Öffne links einen Kompetenzbereich und klicke auf die grauen Kreise, um zu starten.'}</p>`;
  const notes=collectNotes();
  html+=`<div class="dashboard-box"><h3>📝 Meine Notizen (${notes.length})</h3>`;
  if(notes.length===0){
    html+='<p style="color:#888;">Noch keine Notizen erfasst. Klicke bei einer Kompetenz auf 📝, um deine Reflexion festzuhalten – sie erscheint dann hier gesammelt.</p>';
  } else {
    notes.forEach(n=>{
      const d=n.updated? new Date(n.updated).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}) : '';
      html+=`<div class="journal-entry"><div class="j-date">${n.areaIcon} ${escapeHtml(n.areaName)}${d?' · '+d:''}</div><div style="font-weight:600;margin-bottom:4px;">${escapeHtml(n.compText)}</div><div class="j-text">${escapeHtml(n.note)}</div></div>`;
    });
  }
  html+='</div>';
  document.getElementById('tab-dashboard').innerHTML=html;
}

/* ---------- Lerntagebuch ---------- */
function renderJournal(){
  const entries=loadJournal();
  let html=`<div class="journal-input">`+
    `<h3 style="margin-bottom:10px;">📔 Neuer Eintrag</h3>`+
    `<div class="journal-prompts">Leitfragen: Was habe ich in dieser Woche gelernt oder geübt? Wo stehe ich gerade? Was nehme ich mir als Nächstes vor?</div>`+
    `<textarea id="journalInput" rows="4" placeholder="Deine Reflexion..."></textarea>`+
    `<div style="text-align:right;margin-top:10px;"><button class="action-btn save" onclick="addJournalEntry()">Eintrag speichern</button></div>`+
    `</div><h3 style="margin:20px 0 10px;">Meine bisherigen Einträge</h3>`;
  if(entries.length===0){
    html+='<p style="color:#888;">Noch keine Einträge vorhanden. Trage regelmäßig ein, wie es läuft – so siehst du deine eigene Entwicklung über die Wochen.</p>';
  } else {
    entries.slice().reverse().forEach((e,revIdx)=>{
      const idx=entries.length-1-revIdx;
      const d=new Date(e.date);
      html+=`<div class="journal-entry"><div class="j-date">${d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})} um ${d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</div><div class="j-text">${escapeHtml(e.text)}</div><div class="j-actions"><button class="action-btn danger" onclick="deleteJournalEntry(${idx})">Löschen</button></div></div>`;
    });
  }
  document.getElementById('tab-journal').innerHTML=html;
}
function addJournalEntry(){
  const input=document.getElementById('journalInput');
  const val=input.value.trim();
  if(!val){ showNotification('Bitte trage zuerst etwas ein.','warning'); return; }
  const entries=loadJournal();
  entries.push({date:new Date().toISOString(), text:val});
  saveJournalData(entries);
  renderJournal();
  showNotification('Eintrag gespeichert.','success');
}
function deleteJournalEntry(idx){
  const entries=loadJournal();
  entries.splice(idx,1);
  saveJournalData(entries);
  renderJournal();
}

/* ---------- Backup / Export / Import / Reset ---------- */
function exportProgress(){
  const data={listId:LIST_ID, exportedAt:new Date().toISOString(), progress:loadProgress(), journal:loadJournal()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`Kann-Liste_Backup_${LIST_ID}_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  showNotification('Backup heruntergeladen.','success');
}
function importProgress(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(data.progress) saveProgressData(data.progress);
      if(data.journal) saveJournalData(data.journal);
      renderAreaTabs();
      renderDashboard();
      renderJournal();
      initSaveStatus();
      showNotification('Fortschritt wurde geladen.','success');
    }catch(err){
      showNotification('Diese Datei konnte nicht gelesen werden.','error');
    }
  };
  reader.readAsText(file);
  const inp=document.getElementById('importFile');
  if(inp) inp.value='';
}
function resetProgress(){
  if(!confirm('Wirklich deinen gesamten Stand (Ampeln, Notizen, Lerntagebuch) unwiderruflich löschen?')) return;
  localStorage.removeItem(progressKey());
  localStorage.removeItem(journalKey());
  renderAreaTabs();
  renderDashboard();
  renderJournal();
  initSaveStatus();
  showNotification('Dein Stand wurde zurückgesetzt.','success');
}


/* ---------- Verknüpfung mit dem Lernpfad „Excel-Funktionen“ ---------- */
function modulIds(comp){ return comp.m ? comp.m.split(',') : []; }
function modulLinks(comp){
  const ids=modulIds(comp);
  if(!ids.length) return '';
  return '<div class="modul-link">'+ids.map(id=>{
    const m=MODULE_INFO[id]; if(!m) return '';
    return `<a href="${MODUL_BASIS}${m.datei}" target="_blank" rel="noopener">▶ Lernen: ${escapeHtml(m.titel)}</a>`;
  }).join(' ')+'</div>';
}
function lernpfadErledigt(){
  /* Funktioniert nur, wenn Kann-Liste und Lernpfad auf derselben Webadresse liegen (gleicher Browser-Speicher). */
  try{ const raw=localStorage.getItem(LERNPFAD_KEY); if(raw){ const s=JSON.parse(raw); return s.done||{}; } }catch(e){}
  return null;
}
function renderLernplan(){
  const progress=loadProgress();
  const erledigt=lernpfadErledigt();
  const mods={};
  Object.keys(MODULE_INFO).forEach(id=>{ mods[id]={id:id,komps:[],red:0,yellow:0,green:0,empty:0}; });
  COMPETENCES_DATA.areas.forEach((area,ai)=>{
    area.competences.forEach((c,ci)=>{
      modulIds(c).forEach(id=>{
        if(!mods[id]) return;
        const st=(progress[ai+'_'+ci]&&progress[ai+'_'+ci].status)||'empty';
        mods[id][st]++;
        mods[id].komps.push({text:c.s,status:st});
      });
    });
  });
  const list=Object.values(mods).filter(m=>m.komps.length);
  const needed=list.filter(m=>m.red+m.yellow>0);
  const open=list.filter(m=>m.red+m.yellow===0 && m.empty>0);
  const fine=list.filter(m=>m.red+m.yellow===0 && m.empty===0);
  const minSum=needed.reduce((a,m)=>a+MODULE_INFO[m.id].min,0);
  const sym={empty:'○',red:'✗',yellow:'~',green:'✓'};
  const card=(m)=>{
    const info=MODULE_INFO[m.id];
    const done=erledigt&&erledigt[m.id];
    return `<div class="journal-entry"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;">`+
      `<div style="font-weight:700;">${escapeHtml(info.titel)} <span style="font-weight:400;color:#888;">· ca. ${info.min} Min.${done?' · ✓ im Lernpfad erledigt':''}</span></div>`+
      `<div><a class="action-btn save" style="text-decoration:none;display:inline-block;padding:8px 16px;margin:0 4px 0 0;" href="${MODUL_BASIS}${info.datei}" target="_blank" rel="noopener">Modul öffnen</a>`+
      `<a class="action-btn download" style="text-decoration:none;display:inline-block;padding:8px 16px;margin:0;" href="${MODUL_BASIS}${info.xlsx}" download>Übungsdatei (.xlsx)</a></div></div>`+
      `<ul style="margin:8px 0 0 18px;font-size:0.9em;color:#444;">`+m.komps.map(k=>`<li>${sym[k.status]} ${escapeHtml(k.text)}</li>`).join('')+`</ul></div>`;
  };
  let html='<h2 style="margin:20px 0 6px;">🎯 Mein Lernplan</h2>'+
    '<p style="color:#666;margin-bottom:14px;">Der Lernplan entsteht aus deiner Einschätzung. Module erscheinen, sobald bei einer Kompetenz ✗ (kann ich noch nicht) oder ~ (übe ich gerade) steht. Bereich: Excel-Funktionen.</p>';
  if(!list.length){ html+='<p>Keine Module zugeordnet.</p>'; }
  html+=`<div class="dashboard-box"><h3>📌 Das solltest du jetzt lernen (${needed.length} Module, ca. ${minSum} Minuten)</h3>`;
  html+= needed.length? needed.map(card).join('') : '<p style="color:#888;">Noch nichts offen. Schätze zuerst deine Kompetenzen im Bereich „Tabellenkalkulation › Funktionen“ ein.</p>';
  html+='</div>';
  if(open.length){ html+=`<div class="dashboard-box"><h3>❔ Noch nicht eingeschätzt (${open.length} Module)</h3><p style="color:#666;margin-bottom:8px;">Schätze diese Kompetenzen ein, dann kann der Lernplan sie berücksichtigen.</p>`+open.map(m=>`<div style="padding:4px 0;">○ ${escapeHtml(MODULE_INFO[m.id].titel)}</div>`).join('')+'</div>'; }
  if(fine.length){ html+=`<div class="dashboard-box"><h3>✅ Sicher beherrscht (${fine.length} Module)</h3>`+fine.map(m=>`<div style="padding:4px 0;">✓ ${escapeHtml(MODULE_INFO[m.id].titel)}</div>`).join('')+'</div>'; }
  html+=`<p style="color:#888;font-size:0.85em;">${erledigt?'Der Lernpfad-Fortschritt wurde im Browser gefunden.':'Hinweis: Den Fortschritt im Lernpfad siehst du hier nur, wenn Kann-Liste und Lernpfad auf derselben Webadresse geöffnet werden.'}</p>`;
  document.getElementById('tab-lernplan').innerHTML=html;
}

/* ---------- Initialisierung ---------- */
function init(){
  renderTabNav();
  renderAreaTabs();
  renderLernplan();
  renderDashboard();
  renderJournal();
  initSaveStatus();
  switchTab('area-0');
}
</script>
</head>
<body>
<template id="body-skeleton">
<div class="container">
<div class="layout">

<aside class="sidebar" id="sidebar">
<div class="sidebar-title">📊 Kann-Liste</div>
<div class="sidebar-sub">Kaufmann/Kauffrau für Büromanagement</div>
<nav class="tab-navigation" id="tabNav" aria-label="Navigation"></nav>
<div class="sidebar-divider"></div>
<div class="nav-label">Mein Stand</div>
<div class="sidebar-actions">
<button class="action-btn secondary" onclick="exportProgress()">⬇️ Fortschritt sichern (Backup-Datei)</button>
<button class="action-btn secondary" onclick="document.getElementById('importFile').click()">⬆️ Fortschritt laden</button>
<input type="file" id="importFile" accept="application/json" style="display:none" onchange="importProgress(this.files[0])">
<button class="action-btn secondary" onclick="refreshPrintNotes(); window.print()">🖨️ Drucken / als PDF speichern</button>
<button class="action-btn danger" onclick="resetProgress()">🗑️ Meinen Stand zurücksetzen</button>
</div>
<div class="save-status" id="saveStatus">Noch nichts gespeichert</div>
</aside>

<main class="main">
<header>
<h1>📊 Kann-Liste - Lernportfolio</h1>
<div class="subtitle">Schätze dich ein, halte fest, was du brauchst, und verfolge deine Entwicklung.</div>
</header>

<div class="legend">
<strong>So schätzt du dich ein:</strong>
<div class="legend-item"><span class="legend-dot empty"></span> noch nicht eingeschätzt</div>
<div class="legend-item"><span class="legend-dot red">✗</span> das kann ich noch nicht sicher</div>
<div class="legend-item"><span class="legend-dot yellow">~</span> das übe ich gerade</div>
<div class="legend-item"><span class="legend-dot green">✓</span> das kann ich sicher</div>
<div class="legend-item">📝 Notiz-Symbol anklicken für eine kurze Reflexion</div>
</div>

<div id="tab-container"></div>
<div class="tab-content" id="tab-lernplan"></div>
<div class="tab-content" id="tab-dashboard"></div>
<div class="tab-content" id="tab-journal"></div>
</main>

</div>
</div>

<div class="modal-overlay" id="noteModal">
<div class="modal-content narrow">
<div class="modal-header">
<h2 class="modal-title">📝 Meine Reflexion</h2>
<button class="modal-close" onclick="closeNoteModal()" aria-label="Schließen">✕</button>
</div>
<p id="noteCompetenceText" style="margin-bottom:10px; font-weight:600; color:#333;"></p>
<div class="note-question" id="noteQuestion"></div>
<textarea class="note-textarea" id="noteTextarea" rows="5" placeholder="Deine Notiz (optional) ..."></textarea>
<div style="text-align:right; margin-top:14px;">
<button class="action-btn cancel" onclick="closeNoteModal()">Abbrechen</button>
<button class="action-btn save" onclick="saveNote()">Speichern</button>
</div>
</div>
</div>

<div class="notification" id="globalNotification"></div>
</template>
<script id="app-boot">
document.addEventListener('DOMContentLoaded', function(){
  const skeleton = document.getElementById('body-skeleton');
  document.body.appendChild(skeleton.content.cloneNode(true));
  init();
});
</script>
</body>
</html>
