name: Webversion auf GitHub Pages veröffentlichen

on:
  push:
    branches:
      - main
      - claude/ecstatic-gauss-7tqybv
    paths:
      - "ausgabe/web/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Webversion als Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: ausgabe/web

      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
